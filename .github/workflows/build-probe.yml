name: Build YTProbe IPA

# Builds the YT Probe research app (tvOS) as an UNSIGNED
# .ipa, mirroring build-joetv.yml: the owner signs IPAs
# himself (Signulous), so the workflow builds with
# CODE_SIGNING_ALLOWED=NO and zips the .app into a
# Payload/ layout. The probe bundles NO app tokens and
# needs NO secrets — its YouTube sign-in is runtime
# device-code OAuth. Dispatch-only, single target, so one
# dispatch spends exactly one macOS job.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ytprobe:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute artifact name
        id: names
        run: |
          NAME="YTProbe-ipa-${{ github.run_number }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact / IPA name: ${NAME}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project JoeTV.xcodeproj \
            -scheme YTProbe \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app-ytprobe" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

          test -d "$PWD/build/app-ytprobe/YTProbe.app"
          ls -la "$PWD/build/app-ytprobe/YTProbe.app"

      - name: Assemble IPA
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$PWD/build/app-ytprobe/YTProbe.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"
          shasum -a 256 "${NAME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.name }}.ipa
          if-no-files-found: error
